name: Fetch FB Events & Update Pine Script

# ── Trigger policy ───────────────────────────────────────────────────────────
# Auto schedule DISABLED (2026-07-07): Apify free quota exhausted (HTTP 402)
# and scraping coverage was unreliable. Events are now added manually via
# scripts/manual_add_events.py. This workflow remains dispatch-only as an
# optional Apify backfill tool (costs Apify credits when run).
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      apify_max_posts:
        description: "Max posts to ask Apify for"
        required: false
        default: "10"
      apify_parse_all_results:
        description: "Ask Apify to paginate all results"
        required: false
        type: boolean
        default: false
      apify_start_date:
        description: "Optional backfill start date (YYYY-MM-DD)"
        required: false
        default: ""
      apify_end_date:
        description: "Optional backfill end date (YYYY-MM-DD)"
        required: false
        default: ""
      fetch_ignore_state:
        description: "Ignore saved timestamp and reprocess matching posts"
        required: false
        type: boolean
        default: false
      apify_run_timeout_seconds:
        description: "Apify sync run timeout in seconds"
        required: false
        default: "120"
      apify_memory_mb:
        description: "Apify actor memory in MB"
        required: false
        default: "256"
      skip_fb_fetch:
        description: "Skip Apify/Gemini and rebuild dashboard data only"
        required: false
        type: boolean
        default: false
      runner:
        description: "Runner for market-data rebuild (use macOS if Yahoo rate-limits Ubuntu)"
        required: false
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: ubuntu-latest

jobs:
  update-pine:
    name: Fetch & Inject FB Events
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: write   # needed to commit & push the updated .pine file

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 3. Scrape & classify ─────────────────────────────────────────────────
      - name: Fetch and classify FB posts
        if: ${{ !inputs.skip_fb_fetch }}
        env:
          APIFY_TOKEN:    ${{ secrets.APIFY_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          APIFY_MAX_POSTS: ${{ inputs.apify_max_posts || '10' }}
          APIFY_PARSE_ALL_RESULTS: ${{ inputs.apify_parse_all_results || false }}
          APIFY_START_DATE: ${{ inputs.apify_start_date || '' }}
          APIFY_END_DATE: ${{ inputs.apify_end_date || '' }}
          FETCH_IGNORE_STATE: ${{ inputs.fetch_ignore_state || false }}
          APIFY_RUN_TIMEOUT_SECONDS: ${{ inputs.apify_run_timeout_seconds || '120' }}
          APIFY_MEMORY_MB: ${{ inputs.apify_memory_mb || '256' }}
        run: python scripts/fetch_fb_events.py

      # ── 4. Inject events into .pine ──────────────────────────────────────────
      - name: Update Pine Script with new events
        run: python scripts/update_pine_script.py

      # ── 5. Build GitHub Pages site data ─────────────────────────────────────
      - name: Build site data (docs/events.json)
        run: python scripts/build_site_data.py

      # ── 6. Commit & push (only when the .pine file actually changed) ─────────
      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage every file the scripts may have touched
          git add 8zz-indicator.pine data/last_event_timestamp.json data/market_prices_cache.json data/new_events.json docs/events.json

          # Only commit when there is a real diff
          if git diff --cached --quiet; then
            echo "Nothing changed – skipping commit."
          else
            EVENT_COUNT=$(grep -c "array.push(evt_time," 8zz-indicator.pine || echo "?")
            git commit -m "auto: inject new FB events (total events: ${EVENT_COUNT})"
            # Pull --rebase first to avoid non-fast-forward failures caused by
            # concurrent manual pushes, then push with retry logic.
            git pull --rebase origin main
            for attempt in 1 2 3; do
              git push && break
              echo "Push attempt ${attempt} failed, retrying in 10s…"
              sleep 10
              git pull --rebase origin main
            done
          fi
